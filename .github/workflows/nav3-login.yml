name: Nav3 login sample
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/nav3-login/**'
      - '.github/workflows/nav3-login.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and test state transitions
        working-directory: samples/nav3-login
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nav3-login-debug
          path: samples/nav3-login/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav3-login-tests
          path: samples/nav3-login/app/build/reports/tests/testDebugUnitTest
